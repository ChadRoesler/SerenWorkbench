name: Build & Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Test py${{ matrix.python-version }} [${{ matrix.extras }}]"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Workbench has NO extras matrix by design: mcp is a CORE dep (an
        # MCP server without its protocol SDK is a dashboard with no
        # purpose), and there's no [corp]/[vector]. One leg: dev.
        extras: ["dev"]

    steps:
      - name: Checkout
        # actions/checkout v4 (SHA-pinned; dependabot keeps it fresh)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v5 (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and deps (extras = ${{ matrix.extras }})
        run: pip install -e ".[${{ matrix.extras }}]"
        working-directory: SerenWorkbench
        env:
          # Tests don't care about the real version; pin one so scm never has
          # to compute from history (and so a tagless branch can't trip it).
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: SerenWorkbench

  # ── Install shapes ──────────────────────────────────────────────────────
  #
  # `test` installs [dev] and runs pytest FROM INSIDE the repo. That proves the
  # code works with every dev dependency present and ./seren_workbench on sys.path.
  # It proves nothing about what an operator gets from `pip install seren-workbench`.
  #
  # Two real breakages got past `test` and would have been caught here:
  #   1. An unconditional import of an OPTIONAL dependency - invisible when the
  #      dev install pulls it in anyway, fatal on a bare install.
  #   2. A satisfied-but-stale floor (seren-meninges>=2.0.0 happily resolving
  #      2.0.0 after 2.1.0 shipped). Only a real resolve in a clean env shows it.
  #
  # So: install every SHAPE an operator can ask for, then import the app FROM
  # OUTSIDE THE REPO so the source tree cannot mask a missing dependency.
  #
  # Every shape runs on every push, including the slow ones, and this job GATES
  # the release. The maintainer eats the CI time so nobody eats a broken install.
  install-shapes:
    runs-on: ubuntu-latest
    name: "Install ${{ matrix.shape.label }}"
    strategy:
      fail-fast: false
      matrix:
        shape:
          - { label: "bare",          spec: ".",            updates: "unavailable" }
          - { label: "[corp]",    spec: ".[corp]",    updates: "unavailable" }
          - { label: "[updates]", spec: ".[updates]", updates: "wired" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ${{ matrix.shape.spec }}
        run: pip install "${{ matrix.shape.spec }}"
        working-directory: SerenWorkbench
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Install a test client (NOT part of the shape under test)
        # starlette's TestClient needs httpx at runtime. It is a test tool, not
        # something seren_workbench imports, so adding it cannot mask a missing runtime
        # dependency - but leaving it out fails the smoke step for a reason that
        # has nothing to do with the install shape.
        run: pip install "httpx2" || pip install "httpx"

      - name: Import and construct the app OUT OF TREE
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          from seren_workbench.app import create_app
          from fastapi.testclient import TestClient

          app = create_app()
          print("app constructed OK")

          with TestClient(app) as c:
              r = c.get("/")
          assert r.status_code == 200, f"/ returned {r.status_code}: {r.text[:300]}"
          u = r.json().get("updates")

          assert isinstance(u, dict), f"/ must always carry an updates dict, got {u!r}"
          expected = {"status", "distribution", "installed", "latest",
                      "update_available", "detail", "checked_at"}
          assert set(u) == expected, f"key drift: {set(u) ^ expected}"
          assert isinstance(u["update_available"], bool)

          # DELIBERATELY NOT ASSERTED: that a non-[updates] shape reports
          # "unavailable". That assertion was wrong and cost real debugging
          # time. seren_meninges.updates lazily imports httpx + packaging, so
          # the [updates] extra GUARANTEES they are present - but its absence
          # guarantees nothing. Six of the nine services already depend on
          # httpx directly, and sentence-transformers drags it in on top, so
          # update checking simply works without the extra. "It worked" is
          # not a failure, and a test that says otherwise sends you hunting a
          # bug that isn't there.
          #
          # What IS invariant:
          KNOWN = {"ok", "disabled", "unavailable", "error"}
          assert u["status"] in KNOWN, f"unknown status {u['status']!r}"
          if u["status"] == "unavailable":
              assert u["update_available"] is False
              assert u["detail"], "unavailable must say how to fix it"
          # Update checking is CORE in seren-meninges now, not an extra, so it
          # must be wired in EVERY shape - bare included. "unavailable" means
          # the checker was never built or its deps are missing, which with
          # core deps can only mean seren-meninges resolved too old. "error" is
          # still fine: a runner with no egress is a legitimate answer.
          assert u["status"] != "unavailable", (
              f"status=unavailable in shape ${{{{ matrix.shape.label }}}} - update "
              f"checking is core now, so this means seren-meninges resolved too "
              f"old or the checker was never constructed. detail={u['detail']}"
          )
          print(f"updates block OK: status={u['status']}")
          PY

  build-and-release:
    needs: [test, install-shapes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v4 (SHA-pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0  # setuptools-scm derives the version from the tag graph

      - name: Set up Python
        # actions/setup-python v5 (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        # (was: SerenCorpusCallosum — a copy-paste fossil that would have
        # failed every tag release with 'no such directory')
        working-directory: SerenWorkbench

      - name: Upload dist as artifact (handed to the publish job)
        # actions/upload-artifact v4 (SHA-pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seren-workbench-dist
          path: SerenWorkbench/dist/

      - name: Upload to GitHub Release
        # softprops/action-gh-release v2 (SHA-pinned)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: SerenWorkbench/dist/*

  pypi-publish:
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seren-workbench
    permissions:
      id-token: write   # MANDATORY for Trusted Publishing; job-level = least privilege
    steps:
      - name: Download the built dist
        # actions/download-artifact v4 (SHA-pinned)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seren-workbench-dist
          path: dist/

      - name: Publish to PyPI (tokenless)
        # Deliberately NOT SHA-pinned: pypa maintains release/v1 as the
        # stable channel and recommends tracking it; matches the sec-passed
        # SerenMemory workflow verbatim, and dependabot watches it.
        uses: pypa/gh-action-pypi-publish@release/v1
