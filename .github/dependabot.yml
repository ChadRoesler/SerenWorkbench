# Keep the SHA-pinned actions + pip deps fresh. Pin AND maintain — a pin
# without dependabot is a slowly-rotting snapshot.
#
# NOTE vs the SCC dependabot this descends from: NO npm block. There is no
# VS Code extension in this repo (the fossil pointed at a nonexistent
# /SerenCorpusCallosumVSCode dir, which makes dependabot error every run).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/SerenWorkbench"
    schedule:
      interval: "weekly"
