# ════════════════════════════════════════════════════════════════════════
#  seren-workbench — MCP server for the Seren stack.
#
#  The tool surface LLMs reach through: builtin tools (memory, web, time,
#  cluster, scheduler) + dynamic YAML-manifest tools, an operator dashboard,
#  and the MCP streamable-HTTP transport — one process, port 7425.
#
#  Family pattern: same layout as seren-memory / seren-loci /
#  seren-corpus-callosum. Version flows from the git tag via setuptools-scm.
# ════════════════════════════════════════════════════════════════════════

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-workbench"
dynamic = ["version"]
description = "MCP server for the Seren stack — the tool surface LLMs reach through."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Chad Roesler" },
]
dependencies = [
    # mcp is a CORE dep here (not an extra like seren-memory's [mcp]) — an
    # MCP server without its protocol SDK is a dashboard with no purpose.
    "mcp>=1.3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "seren-meninges>=1.0.0,<2",
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
seren-workbench = "seren_workbench.__main__:main"

[tool.setuptools_scm]
# Version comes from the git tag; written at build time, read by __init__.
version_file = "seren_workbench/_version.py"
# The repo root is one level up from this pyproject (nested family layout).
root = ".."

[tool.setuptools.packages.find]
include = ["seren_workbench*"]

[tool.setuptools.package-data]
seren_workbench = [
    "viewer/ui/*.html",
    "viewer/ui/*.css",
    "viewer/ui/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
