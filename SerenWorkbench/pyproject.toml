# ════════════════════════════════════════════════════════════════════════
#  seren-workbench — MCP server for the Seren stack.
#
#  The tool surface LLMs reach through: builtin tools (memory, web, time,
#  cluster, scheduler) + dynamic YAML-manifest tools, an operator dashboard,
#  and the MCP streamable-HTTP transport — one process, port 7425.
#
#  Family pattern: same layout as seren-memory / seren-loci /
#  seren-corpus-callosum. Version flows from the git tag via setuptools-scm.
# ════════════════════════════════════════════════════════════════════════

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-workbench"
dynamic = ["version"]
description = "MCP server for the Seren stack — the tool surface LLMs reach through."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Chad Roesler" },
]
dependencies = [
    # mcp is a CORE dep here (not an extra like seren-memory's [mcp]) — an
    # MCP server without its protocol SDK is a dashboard with no purpose.
    #
    # ── WHY THE <2 CAP IS NOT OPTIONAL ────────────────────────────────────
    # mcp 2.0.0 REMOVED FastMCP. `mcp.server.fastmcp` does not exist in 2.x at
    # all; the server class is now mcp.server.mcpserver.MCPServer with a
    # different API. Our mcp/server.py is written against FastMCP. The last
    # 1.x that still carries it is 1.29.0.
    #
    # Uncapped, a fresh install resolves 2.0.0, the import fails, app.py's
    # ImportError gate catches it exactly as designed, and the service comes
    # up in HTTP-only mode with one log line — i.e. /mcp silently ceases to
    # exist. A graceful fallback around a DEPENDENCY BREAK is indistinguishable
    # from the SDK not being installed, which is the worst possible failure
    # mode: it looks like it's working. CI caught it here only because the
    # endpoint tests POST /mcp unconditionally — the other services have no
    # such canary, so they'd have shipped quiet.
    #
    # So: cap it, don't hope. Lift the cap in the same commit that ports
    # server.py to the MCPServer API — across the whole family at once, since
    # they're deliberate copies of each other.
    "mcp>=1.3.0,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # Meninges 2.1.0 is the floor: it carries the bearer-auth byte-compare fix
    # (a non-ASCII Authorization header used to 500 instead of 401) and
    # seren_meninges.updates, which the [updates] extra below imports. <3
    # because a MAJOR here is an un-defaultable security change, and that is
    # the only thing that should ever force a bump.
    "seren-meninges>=2.1.0,<3",
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
# "is there a newer seren-workbench" reporting on GET /. Opt-in, because a box
# that never leaves the LAN has no business calling PyPI. Pulls the Meninges
# extra rather than httpx/packaging directly - the check lives in
# seren_meninges.updates and only one repo should own that dep set.
updates = ["seren-meninges[updates]>=2.1.0,<3"]

# Corporate / intercepting-proxy support. Routes Python TLS through the OS
# trust store so a corp root CA (Zscaler/Netskope/etc.) is honored without
# hand-exporting .pem files. Opt-in: `pip install 'seren-workbench[corp]'` +
# tls.trust_system_store: true (the installer's --corp flag sets both).
#
# THIS EXTRA WAS MISSING while config.py already honored
# SEREN_WORKBENCH_TRUST_SYSTEM_STORE and the installer already offered --corp -
# so an operator could turn the knob on, watch pip warn "does not provide the
# extra 'corp'" in passing, and get a TLS failure much later with nothing
# pointing back here. The knob and the package that implements it must ship
# together.
corp = ["truststore>=0.9"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
seren-workbench = "seren_workbench.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenWorkbench"
Repository = "https://github.com/ChadRoesler/SerenWorkbench"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenWorkbench/issues"

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root, not the SerenWorkbench subdir)
root = ".."
version_scheme = "release-branch-semver"
# Write the tag-derived version into the package (shipped in the wheel, read
# by __init__ / importlib.metadata). Replaces the old sed-on-__init__ hack -
# version now flows from the git tag with no manual step. _version.py is
# gitignored; it's a build artifact, never committed.
version_file = "seren_workbench/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["seren_workbench*"]

[tool.setuptools.package-data]
seren_workbench = [
    "viewer/ui/*.html",
    "viewer/ui/*.css",
    "viewer/ui/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
